name: CI/CD → ECS (OIDC)

on:
  push:
    branches: [develop]

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: self-hosted

    env:
      IMAGE_TAG: ${{ github.sha }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
    - uses: actions/checkout@v4

    - name: Login to GHCR
      run: |
        echo "${{ secrets.GHCR_TOKEN }}" | \
        docker login ghcr.io -u zaheerabbas0 --password-stdin

    - name: Build & Push Backend
      run: |
        docker build -t ghcr.io/zaheerabbas0/greenx-backend:${IMAGE_TAG} ./GreenX_DCS_Assesment_Tool_Backend
        docker push ghcr.io/zaheerabbas0/greenx-backend:${IMAGE_TAG}

    - name: Build & Push Frontend
      run: |
        docker build -t ghcr.io/zaheerabbas0/greenx-frontend:${IMAGE_TAG} ./greenX-assessment-tool-frontend
        docker push ghcr.io/zaheerabbas0/greenx-frontend:${IMAGE_TAG}

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy to ECS
      uses: donaldpiret/ecs-deploy@v0.2.0
      with:
        cluster: test-ecs-cluster-new
        target: new-service-ecs
        tag: ${{ github.sha }}
        rollback: true
        timeout: 1000