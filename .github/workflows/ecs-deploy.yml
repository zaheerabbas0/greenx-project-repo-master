name: CI/CD → ECS EC2 with PR Environments (ALB Path Routing)

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review, closed]

  push:
    branches: [develop]

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  CLUSTER: test-ecs-cluster-new
  ALB_DNS: test-devops-alb-1759750993.us-east-1.elb.amazonaws.com
  CONTAINER_PORT: 8000
  TASK_FAMILY: test-task-definition
  CONTAINER_NAME: backend

jobs:
  pr-deploy:
    name: PR → Build & Deploy Environment
    runs-on: self-hosted
    environment: devops-plan

    if: github.event_name == 'pull_request' && github.event.action != 'closed'

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      IMAGE_TAG: pr-${{ github.event.pull_request.number }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to GHCR
      run: |
        echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u zaheerabbas0 --password-stdin

    - name: Build & Push Backend Image
      run: |
        docker build -t ghcr.io/zaheerabbas0/greenx-backend:${IMAGE_TAG} ./GreenX_DCS_Assesment_Tool_Backend
        docker push ghcr.io/zaheerabbas0/greenx-backend:${IMAGE_TAG}

    - name: Configure AWS (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}
    - name: Get latest task definition ARN (stable)
      shell: bash
      run: |
        echo "Resolving latest task definition for family: ${TASK_FAMILY}"

        TASK_DEF_ARN=$(aws ecs list-task-definitions \
          --family-prefix "${TASK_FAMILY}" \
          --status ACTIVE \
          --sort DESC \
          --query 'taskDefinitionArns[0]' \
          --output text)

        if [ -z "$TASK_DEF_ARN" ] || [ "$TASK_DEF_ARN" = "None" ]; then
          echo "❌ ERROR: Failed to resolve task definition ARN"
          exit 1
        fi

        echo "Latest task definition: $TASK_DEF_ARN"
        echo "BASE_TASK_DEF_ARN=$TASK_DEF_ARN" >> "$GITHUB_ENV"


    - name: Fetch base task definition
      run: |
        aws ecs describe-task-definition \
          --task-definition ${BASE_TASK_DEF_ARN} \
          --query taskDefinition > taskdef.json

    - name: Render PR task definition
      run: |
        jq '
          del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )
          | .containerDefinitions[0].image="ghcr.io/zaheerabbas0/greenx-backend:'"${IMAGE_TAG}"'"
        ' taskdef.json > taskdef-pr.json

    - name: Register PR task definition
      run: |
        TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://taskdef-pr.json \
          --query "taskDefinition.taskDefinitionArn" \
          --output text)

        echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

    # -------- ALB TARGET GROUP --------
    - name: Create Target Group (EC2)
      run: |
        TG_ARN=$(aws elbv2 create-target-group \
          --name tg-pr-${PR_NUMBER} \
          --protocol HTTP \
          --port ${CONTAINER_PORT} \
          --vpc-id ${{ secrets.VPC_ID }} \
          --target-type instance \
          --health-check-path /health \
          --query 'TargetGroups[0].TargetGroupArn' \
          --output text)

        echo "TG_ARN=$TG_ARN" >> $GITHUB_ENV

    - name: Create ECS Service (PR)
      run: |
        aws ecs create-service \
          --cluster ${CLUSTER} \
          --service-name greenx-pr-${PR_NUMBER} \
          --task-definition ${TASK_DEF_ARN} \
          --desired-count 1 \
          --load-balancers targetGroupArn=${TG_ARN},containerName=${CONTAINER_NAME},containerPort=${CONTAINER_PORT}

    - name: Create ALB Path Rule
      run: |
        aws elbv2 create-rule \
          --listener-arn ${{ secrets.LISTENER_ARN }} \
          --priority $((1000 + PR_NUMBER)) \
          --conditions Field=path-pattern,Values="/pr-${PR_NUMBER}/*" \
          --actions Type=forward,TargetGroupArn=${TG_ARN}

    - name: PR Environment URL
      run: |
        echo " PR ENV READY"
        echo " http://${ALB_DNS}/pr-${PR_NUMBER}"

  pr-cleanup:
    name: PR → Destroy Environment
    runs-on: self-hosted

    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
    - name: Configure AWS (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Delete ECS Service
      run: |
        aws ecs update-service \
          --cluster test-ecs-cluster-new \
          --service greenx-pr-${PR_NUMBER} \
          --desired-count 0 || true

        aws ecs delete-service \
          --cluster test-ecs-cluster-new \
          --service greenx-pr-${PR_NUMBER} \
          --force || true

    - name: Delete Target Group
      run: |
        TG_ARN=$(aws elbv2 describe-target-groups \
          --names tg-pr-${PR_NUMBER} \
          --query 'TargetGroups[0].TargetGroupArn' \
          --output text)

        aws elbv2 delete-target-group --target-group-arn $TG_ARN || true

  deploy-develop:
    name: Develop → Deploy Shared Environment
    runs-on: self-hosted
    environment: devops-plan

    if: github.event_name == 'push'

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to GHCR
      run: |
        echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u zaheerabbas0 --password-stdin

    - name: Build & Push Backend Image
      run: |
        docker build -t ghcr.io/zaheerabbas0/greenx-backend:${IMAGE_TAG} ./GreenX_DCS_Assesment_Tool_Backend
        docker push ghcr.io/zaheerabbas0/greenx-backend:${IMAGE_TAG}

    - name: Configure AWS (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy to ECS (Develop)
      uses: donaldpiret/ecs-deploy@v0.2.0
      with:
        cluster: test-ecs-cluster-new
        target: new-service-ecs
        tag: ${{ github.sha }}
        rollback: true
        timeout: 1000
